name: 'CI/CD Pipeline - Terraform & Backend Deployment'

on:
  push:
    branches:
      - main
      - deployment
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - deploy-backend

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-2
  TF_VERSION: '1.6.0'

jobs:
  terraform-validate:
    name: 'Terraform Validation'
    runs-on: ubuntu-latest
    outputs:
      plan-exit-code: ${{ steps.plan.outputs.exitcode }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan -detailed-exitcode
        continue-on-error: true

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 5

      - name: Comment PR with Plan Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Format 🖌 \`${{ steps.fmt.outcome }}\`
            #### Terraform Init ⚙️ \`${{ steps.init.outcome }}\`
            #### Terraform Validate 🤖 \`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`
            
            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  terraform-apply:
    name: 'Terraform Apply (Manual)'
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event.inputs.action == 'apply'
    environment: production
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-terraform-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  deploy-backend:
    name: 'Deploy Node.js Backend'
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event.inputs.action == 'deploy-backend' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    environment: production
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.BACKEND_EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy Backend Application
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.EC2_SSH_USER }}@${{ secrets.BACKEND_EC2_HOST }} << 'DEPLOY_SCRIPT'
            set -e
            echo "🚀 Starting backend deployment..."
            
            # Navigate to application directory
            cd ${{ secrets.BACKEND_APP_PATH || '/home/ubuntu/app' }}
            
            # Pull latest code (if using git on server)
            if [ -d ".git" ]; then
              echo "📥 Pulling latest changes..."
              git pull origin main
            fi
            
            # Install dependencies
            echo "📦 Installing dependencies..."
            npm ci --production
            
            # Restart application with PM2
            echo "🔄 Restarting application..."
            if pm2 list | grep -q "backend"; then
              pm2 restart backend
            else
              pm2 start npm --name "backend" -- start
            fi
            
            pm2 save
            
            echo "✅ Backend deployment completed successfully!"
          DEPLOY_SCRIPT

      - name: Health Check
        run: |
          echo "🏥 Running health check..."
          sleep 10
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.EC2_SSH_USER }}@${{ secrets.BACKEND_EC2_HOST }} << 'HEALTH_CHECK'
            curl -f http://localhost:${PORT:-3000}/health || curl -f http://localhost:${PORT:-3000}/ || echo "⚠️ Health check endpoint not available, but deployment completed"
          HEALTH_CHECK

      - name: Cleanup SSH Key
        if: always()
        run: rm -f ~/.ssh/deploy_key