<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1200" height="800" fill="#F8FAFC"/>
  
  <!-- Title -->
  <text x="600" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1E293B" text-anchor="middle">TrackFleet - Real-Time Fleet Management System</text>
  <text x="600" y="55" font-family="Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">500 Drivers | 50 Dispatchers | 10 Warehouses | Budget: &lt;$300/month</text>
  
  <!-- Client Layer Label -->
  <text x="30" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">CLIENTS</text>
  
  <!-- Web Dashboard (Dispatchers) -->
  <rect x="80" y="115" width="160" height="80" rx="8" ry="8" fill="#3B82F6" stroke="#2563EB" stroke-width="2"/>
  <text x="160" y="145" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Web Dashboard</text>
  <text x="160" y="165" font-family="Arial, sans-serif" font-size="11" fill="#DBEAFE" text-anchor="middle">Dispatchers (50)</text>
  <text x="160" y="182" font-family="Arial, sans-serif" font-size="10" fill="#BFDBFE" text-anchor="middle">React/Vue.js</text>
  
  <!-- Android Driver App -->
  <rect x="280" y="115" width="160" height="80" rx="8" ry="8" fill="#10B981" stroke="#059669" stroke-width="2"/>
  <text x="360" y="145" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Android App</text>
  <text x="360" y="165" font-family="Arial, sans-serif" font-size="11" fill="#D1FAE5" text-anchor="middle">Drivers (500)</text>
  <text x="360" y="182" font-family="Arial, sans-serif" font-size="10" fill="#A7F3D0" text-anchor="middle">Offline GPS Tracking</text>
  
  <!-- iPad Warehouse App -->
  <rect x="480" y="115" width="160" height="80" rx="8" ry="8" fill="#8B5CF6" stroke="#7C3AED" stroke-width="2"/>
  <text x="560" y="145" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">iPad App</text>
  <text x="560" y="165" font-family="Arial, sans-serif" font-size="11" fill="#EDE9FE" text-anchor="middle">Warehouse Mgrs (10)</text>
  <text x="560" y="182" font-family="Arial, sans-serif" font-size="10" fill="#DDD6FE" text-anchor="middle">iOS Native</text>
  
  <!-- API Gateway / Load Balancer -->
  <rect x="200" y="250" width="360" height="60" rx="8" ry="8" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
  <text x="380" y="278" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">API Gateway / Load Balancer</text>
  <text x="380" y="295" font-family="Arial, sans-serif" font-size="10" fill="#FEF3C7" text-anchor="middle">AWS API Gateway / Nginx</text>
  
  <!-- Backend Services Layer Label -->
  <text x="30" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">SERVICES</text>
  
  <!-- Fleet Service -->
  <rect x="50" y="370" width="140" height="90" rx="8" ry="8" fill="#0EA5E9" stroke="#0284C7" stroke-width="2"/>
  <text x="120" y="400" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Fleet Service</text>
  <text x="120" y="420" font-family="Arial, sans-serif" font-size="10" fill="#E0F2FE" text-anchor="middle">Vehicle Tracking</text>
  <text x="120" y="435" font-family="Arial, sans-serif" font-size="10" fill="#E0F2FE" text-anchor="middle">Route Management</text>
  <text x="120" y="450" font-family="Arial, sans-serif" font-size="10" fill="#BAE6FD" text-anchor="middle">Node.js</text>
  
  <!-- GPS Service -->
  <rect x="210" y="370" width="140" height="90" rx="8" ry="8" fill="#0EA5E9" stroke="#0284C7" stroke-width="2"/>
  <text x="280" y="400" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">GPS Service</text>
  <text x="280" y="420" font-family="Arial, sans-serif" font-size="10" fill="#E0F2FE" text-anchor="middle">Real-time Location</text>
  <text x="280" y="435" font-family="Arial, sans-serif" font-size="10" fill="#E0F2FE" text-anchor="middle">Offline Sync</text>
  <text x="280" y="450" font-family="Arial, sans-serif" font-size="10" fill="#BAE6FD" text-anchor="middle">WebSocket</text>
  
  <!-- Notification Service -->
  <rect x="370" y="370" width="140" height="90" rx="8" ry="8" fill="#0EA5E9" stroke="#0284C7" stroke-width="2"/>
  <text x="440" y="400" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Notification Svc</text>
  <text x="440" y="420" font-family="Arial, sans-serif" font-size="10" fill="#E0F2FE" text-anchor="middle">SMS Alerts</text>
  <text x="440" y="435" font-family="Arial, sans-serif" font-size="10" fill="#E0F2FE" text-anchor="middle">Push Notifications</text>
  <text x="440" y="450" font-family="Arial, sans-serif" font-size="10" fill="#BAE6FD" text-anchor="middle">Node.js</text>
  
  <!-- Billing Service -->
  <rect x="530" y="370" width="140" height="90" rx="8" ry="8" fill="#0EA5E9" stroke="#0284C7" stroke-width="2"/>
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Billing Service</text>
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="10" fill="#E0F2FE" text-anchor="middle">Invoice Payments</text>
  <text x="600" y="435" font-family="Arial, sans-serif" font-size="10" fill="#E0F2FE" text-anchor="middle">Subscriptions</text>
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="10" fill="#BAE6FD" text-anchor="middle">Node.js</text>
  
  <!-- External Services Label -->
  <text x="780" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">EXTERNAL SERVICES</text>
  
  <!-- Twilio -->
  <rect x="720" y="115" width="140" height="70" rx="8" ry="8" fill="#F43F5E" stroke="#E11D48" stroke-width="2"/>
  <text x="790" y="145" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Twilio</text>
  <text x="790" y="165" font-family="Arial, sans-serif" font-size="10" fill="#FFE4E6" text-anchor="middle">SMS Alerts</text>
  <text x="790" y="178" font-family="Arial, sans-serif" font-size="9" fill="#FECDD3" text-anchor="middle">~$50/month</text>
  
  <!-- Mapbox -->
  <rect x="880" y="115" width="140" height="70" rx="8" ry="8" fill="#06B6D4" stroke="#0891B2" stroke-width="2"/>
  <text x="950" y="145" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Mapbox</text>
  <text x="950" y="165" font-family="Arial, sans-serif" font-size="10" fill="#CFFAFE" text-anchor="middle">Live Maps</text>
  <text x="950" y="178" font-family="Arial, sans-serif" font-size="9" fill="#A5F3FC" text-anchor="middle">~$50/month</text>
  
  <!-- Stripe -->
  <rect x="1040" y="115" width="140" height="70" rx="8" ry="8" fill="#6366F1" stroke="#4F46E5" stroke-width="2"/>
  <text x="1110" y="145" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Stripe</text>
  <text x="1110" y="165" font-family="Arial, sans-serif" font-size="10" fill="#E0E7FF" text-anchor="middle">Invoice Payments</text>
  <text x="1110" y="178" font-family="Arial, sans-serif" font-size="9" fill="#C7D2FE" text-anchor="middle">2.9% + $0.30/txn</text>
  
  <!-- Data Layer Label -->
  <text x="30" y="520" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">DATA LAYER</text>
  
  <!-- PostgreSQL -->
  <rect x="100" y="540" width="150" height="80" rx="8" ry="8" fill="#336791" stroke="#1E4A6D" stroke-width="2"/>
  <text x="175" y="570" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">PostgreSQL</text>
  <text x="175" y="590" font-family="Arial, sans-serif" font-size="10" fill="#B8D4E8" text-anchor="middle">Fleet, Users, Routes</text>
  <text x="175" y="608" font-family="Arial, sans-serif" font-size="9" fill="#93C5E8" text-anchor="middle">AWS RDS ~$50/mo</text>
  
  <!-- Redis -->
  <rect x="280" y="540" width="150" height="80" rx="8" ry="8" fill="#DC382D" stroke="#B91C1C" stroke-width="2"/>
  <text x="355" y="570" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Redis</text>
  <text x="355" y="590" font-family="Arial, sans-serif" font-size="10" fill="#FECACA" text-anchor="middle">Real-time GPS Cache</text>
  <text x="355" y="608" font-family="Arial, sans-serif" font-size="9" fill="#FCA5A5" text-anchor="middle">ElastiCache ~$30/mo</text>
  
  <!-- TimescaleDB -->
  <rect x="460" y="540" width="150" height="80" rx="8" ry="8" fill="#FDB515" stroke="#D97706" stroke-width="2"/>
  <text x="535" y="570" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">TimescaleDB</text>
  <text x="535" y="590" font-family="Arial, sans-serif" font-size="10" fill="#FEF3C7" text-anchor="middle">GPS History Data</text>
  <text x="535" y="608" font-family="Arial, sans-serif" font-size="9" fill="#FDE68A" text-anchor="middle">Time-series ~$40/mo</text>
  
  <!-- Infrastructure Box -->
  <rect x="720" y="250" width="300" height="220" rx="8" ry="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <text x="870" y="275" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">AWS Infrastructure</text>
  
  <!-- EC2/ECS -->
  <rect x="740" y="295" width="120" height="50" rx="6" ry="6" fill="#FF9900" stroke="#CC7A00" stroke-width="1"/>
  <text x="800" y="318" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">EC2 / ECS</text>
  <text x="800" y="335" font-family="Arial, sans-serif" font-size="9" fill="#FFF7E6" text-anchor="middle">~$80/month</text>
  
  <!-- S3 -->
  <rect x="880" y="295" width="120" height="50" rx="6" ry="6" fill="#569A31" stroke="#3D6B22" stroke-width="1"/>
  <text x="940" y="318" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">S3 Storage</text>
  <text x="940" y="335" font-family="Arial, sans-serif" font-size="9" fill="#E8F5E0" text-anchor="middle">~$10/month</text>
  
  <!-- CloudWatch -->
  <rect x="740" y="360" width="120" height="50" rx="6" ry="6" fill="#FF4F8B" stroke="#CC3F6F" stroke-width="1"/>
  <text x="800" y="383" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">CloudWatch</text>
  <text x="800" y="400" font-family="Arial, sans-serif" font-size="9" fill="#FFE4EC" text-anchor="middle">Monitoring</text>
  
  <!-- Cognito -->
  <rect x="880" y="360" width="120" height="50" rx="6" ry="6" fill="#DD344C" stroke="#B02A3D" stroke-width="1"/>
  <text x="940" y="383" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Cognito</text>
  <text x="940" y="400" font-family="Arial, sans-serif" font-size="9" fill="#FFE4E8" text-anchor="middle">Auth ~$0</text>
  
  <!-- CloudFront -->
  <rect x="810" y="420" width="120" height="40" rx="6" ry="6" fill="#8C4FFF" stroke="#6B3ACC" stroke-width="1"/>
  <text x="870" y="445" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">CloudFront CDN</text>
  
  <!-- Connection Lines -->
  <!-- Web Dashboard to API Gateway -->
  <line x1="160" y1="195" x2="300" y2="250" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Android App to API Gateway -->
  <line x1="360" y1="195" x2="380" y2="250" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- iPad App to API Gateway -->
  <line x1="520" y1="195" x2="460" y2="250" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- API Gateway to Services -->
  <line x1="280" y1="310" x2="120" y2="370" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="340" y1="310" x2="280" y2="370" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="310" x2="440" y2="370" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="480" y1="310" x2="600" y2="370" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Services to Databases -->
  <line x1="120" y1="460" x2="175" y2="540" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="280" y1="460" x2="355" y2="540" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="280" y1="460" x2="535" y2="540" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="460" x2="175" y2="540" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- External Service Connections -->
  <line x1="440" y1="370" x2="720" y2="150" stroke="#F43F5E" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <line x1="280" y1="370" x2="880" y2="150" stroke="#06B6D4" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="370" x2="1040" y2="150" stroke="#6366F1" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  
  <!-- API Gateway to AWS -->
  <line x1="560" y1="280" x2="720" y2="320" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Budget Summary Box -->
  <rect x="720" y="540" width="300" height="100" rx="8" ry="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="870" y="565" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#065F46" text-anchor="middle">Monthly Cost Estimate</text>
  <text x="740" y="590" font-family="Arial, sans-serif" font-size="11" fill="#047857">AWS (EC2, RDS, Redis, S3): ~$210</text>
  <text x="740" y="608" font-family="Arial, sans-serif" font-size="11" fill="#047857">Twilio + Mapbox: ~$100</text>
  <text x="740" y="626" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#065F46">Total: ~$310/month ✓</text>
  
  <!-- Legend -->
  <rect x="50" y="680" width="500" height="100" rx="8" ry="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="70" y="705" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">Legend:</text>
  
  <rect x="70" y="720" width="20" height="12" fill="#3B82F6"/>
  <text x="95" y="730" font-family="Arial, sans-serif" font-size="10" fill="#475569">Web Client</text>
  
  <rect x="170" y="720" width="20" height="12" fill="#10B981"/>
  <text x="195" y="730" font-family="Arial, sans-serif" font-size="10" fill="#475569">Android App</text>
  
  <rect x="280" y="720" width="20" height="12" fill="#8B5CF6"/>
  <text x="305" y="730" font-family="Arial, sans-serif" font-size="10" fill="#475569">iOS App</text>
  
  <rect x="370" y="720" width="20" height="12" fill="#0EA5E9"/>
  <text x="395" y="730" font-family="Arial, sans-serif" font-size="10" fill="#475569">Backend Services</text>
  
  <line x1="70" y1="755" x2="100" y2="755" stroke="#6B7280" stroke-width="2"/>
  <text x="105" y="758" font-family="Arial, sans-serif" font-size="10" fill="#475569">Internal Flow</text>
  
  <line x1="200" y1="755" x2="230" y2="755" stroke="#6B7280" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="235" y="758" font-family="Arial, sans-serif" font-size="10" fill="#475569">External API</text>
  
  <!-- Scale indicator -->
  <text x="1050" y="680" font-family="Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Scale: 500 drivers</text>
  <text x="1050" y="698" font-family="Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">50 dispatchers</text>
  <text x="1050" y="716" font-family="Arial, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">10 warehouses</text>
  
  <!-- Real-time indicator -->
  <circle cx="1100" y="760" r="8" fill="#10B981"/>
  <circle cx="1100" y="760" r="8" fill="#10B981" opacity="0.5">
    <animate attributeName="r" values="8;16;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="1115" y="764" font-family="Arial, sans-serif" font-size="10" fill="#065F46">Real-time GPS</text>
</svg>